<!doctype html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments">
        <li class="comment">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button"></button>
            </div>
          </div>
        </li>
        <li class="comment">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    "use strict";

    const comments = [
      {
        name: "Глеб Фокин",
        date: "12.02.22 12:18",
        text: "Это будет первый комментарий на этой странице",
        likes: 3,
        isLiked: false,
      },
      {
        name: "Варвара Н.",
        date: "13.02.22 19:22",
        text: "Мне нравится как оформлена эта страница! ❤",
        likes: 75,
        isLiked: true,
      },
    ];

    const nameInput = document.querySelector(".add-form-name");
    const commentInput = document.querySelector(".add-form-text");
    const addButton = document.querySelector(".add-form-button");
    const commentsList = document.querySelector(".comments");

    function validateInputs() {
      if (nameInput.value.trim() === "" || commentInput.value.trim() === "") {
        addButton.disabled = true;
      } else {
        addButton.disabled = false;
      }
    }

    validateInputs();
    nameInput.addEventListener("input", validateInputs);
    commentInput.addEventListener("input", validateInputs);

    function sanitize(text) {
      return text.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
    }

    function getFormattedDate() {
      const date = new Date();
      const day = String(date.getDate()).padStart(2, "0");
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const year = String(date.getFullYear()).slice(-2);
      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");

      return `${day}.${month}.${year} ${hours}:${minutes}`;
    }

    function initLikeListeners() {
      const likeButtons = document.querySelectorAll(".like-button");

      likeButtons.forEach((button) => {
        button.addEventListener("click", (e) => {
          e.stopPropagation();
          const index = button.dataset.index;
          const comment = comments[index];

          if (comment.isLiked) {
            comment.likes--;
            comment.isLiked = false;
          } else {
            comment.likes++;
            comment.isLiked = true;
          }

          renderComments();
        });
      });
    }

    function renderComments() {
      const commentsHtml = comments
        .map((comment, index) => {
          return `
            <li class="comment" data-index="${index}">
              <div class="comment-header">
                <div>${sanitize(comment.name)}</div>
                <div>${comment.date}</div>
              </div>
              <div class="comment-body">
                <div class="comment-text">
                  ${sanitize(comment.text)}
                </div>
              </div>
              <div class="comment-footer">
                <div class="likes">
                  <span class="likes-counter">${comment.likes}</span>
                  <button 
                    class="like-button ${comment.isLiked ? "-active-like" : ""}" 
                    data-index="${index}">
                  </button>
                </div>
              </div>
            </li>
          `;
        })
        .join("");

      commentsList.innerHTML = commentsHtml;

      initLikeListeners();
    }

    addButton.addEventListener("click", function () {
      if (nameInput.value.trim() === "" || commentInput.value.trim() === "") {
        return;
      }

      comments.push({
        name: nameInput.value.replaceAll("<", "&lt;").replaceAll(">", "&gt;"),
        date: getFormattedDate(),
        text: commentInput.value.replaceAll("<", "&lt;").replaceAll(">", "&gt;"),
        likes: 0,
        isLiked: false,
      });

      renderComments();

      nameInput.value = "";
      commentInput.value = "";
      validateInputs();
    });

    renderComments();


    // Домашка 3. 
   commentsList.addEventListener('click', (e) => {
  if (e.target.classList.contains('like-button')) {
    return;
  }

  const commentElement = e.target.closest('.comment');
  if (!commentElement) {
    return;
  }

  const index = commentElement.dataset.index;
  const name = comments[index].name;
  const text = comments[index].text;

  commentInput.value = `* ${name}\n* ${text}\n-`;

  validateInputs();
});


  </script>
</html>
